<style>

  .bar button:focus-visible{outline:2px solid var(--red);outline-offset:2px}
  .spacer{flex:1}.hint{color:#5C6376}
  .bar a.lnk{font-family:var(--mono);font-size:.66rem;letter-spacing:.1em;text-transform:uppercase;padding:5px 11px;color:#F2F4F8;border:1px solid var(--red);border-radius:8px;text-decoration:none;background:rgba(224,66,75,.14)}

  /* stage */

  .stage{position:relative;width:min(100%,calc((100vh - 150px)*16/9));aspect-ratio:16/9;container-type:size;background:var(--bg);color:var(--t1);overflow:hidden;border-radius:14px;box-shadow:0 30px 90px rgba(0,0,0,.7);cursor:pointer}
  .slide{position:absolute;inset:0;overflow:hidden}
  .pad{position:absolute;inset:10cqh 6.5cqw 7.5cqh;display:flex;flex-direction:column;gap:2.2cqh}
  .pad > *{min-height:0}
  .num{position:absolute;top:3.4cqh;right:6.5cqw;font-family:var(--mono);font-size:1.1cqw;letter-spacing:.22em;color:var(--t3);z-index:2}

  .cover .tag{font-family:var(--sora);font-weight:700;font-size:3cqw;line-height:1.15;margin:0;letter-spacing:-.008em;word-spacing:.06em}

  .yes,.no{display:inline-grid;place-items:center;border-radius:50%;font-family:var(--sora);font-weight:800}

{"m":"Slide 1 \u00b7 35 s \u00b7 Who he is","say":"This is why he matters. <em>Twenty-four thousand four hundred followers.</em> But look at the second number \u2014 he follows back <em>five hundred and forty-two</em> — forty-five people follow him for every one he follows back. This is not a follow-for-follow account, it is an audience. He is a <em>certified personal trainer.</em> He has stood on a competition stage <em>seven times.</em> What he actually teaches is posture and form \u2014 <em>exactly what a beginner gets wrong.</em> And he posts in Arabic, from Finland. <em>They have watched him compete, and that is why they listen.</em><br><span style=\'color:#8C93A6\'>How to read: Hit 24,400, then pause and point at 542. That contrast is the credibility, do not rush it. All of this is off his public profile, checked 20 September \u2014 say so if challenged.</span>"},

{"m":"Slide 2 \u00b7 30 s \u00b7 The deal","say":"Here is the exchange. <em>He sends his followers in.</em> They train on <em>his</em> programme, his name on it. And for every one of them paying for Pro, <em>he takes twenty per cent, every month they stay.</em> What he already sells himself? <em>We take nothing.</em> Not a cent. <em>He gets paid to send us his gym.</em><br><span style=\'color:#8C93A6\'>How to read: Green arrow across, red arrow back. Two gestures. EXPECT: what if someone trains with two coaches? One coach is paid at a time \u2014 it follows the programme they are on, and it moves if they switch.</span>"},

{"m":"Slide 3 \u00b7 35 s \u00b7 What he brings","say":"So what is he worth? <em>Two in every hundred</em> of his followers join \u2014 and two per cent is deliberately low for an audience that already trusts him. That is <em>five hundred members.</em> At ten euros a month, <em>five thousand euros a month.</em> <em>One thousand</em> goes to Ali. <em>Four thousand</em> stays with us. Every month. And notice who these people are \u2014 <em>they are Arabic speakers. Not one of them was in our Spanish numbers.</em> This is a market we had not counted at all.<br><span style=\'color:#8C93A6\'>How to read: Walk the chain, then the split, then land on the Arabic line \u2014 that is the real point of the slide. BE HONEST: two in a hundred is our assumption, not a measurement. Say &quot;if two in a hundred join&quot;. The exact figure is 488, rounded to 500. EXPECT: &quot;your study was about Spain&quot; \u2014 yes, and this is on top of it, not instead of it.</span>"}

(function () {
  var NOTES = window.__NOTES__ || [];
  var slides = [].slice.call(document.querySelectorAll('.slide')), cur = 0;
  var elLbl = document.getElementById('lbl'), elProg = document.getElementById('prog'), notes = document.getElementById('notes');
  var btnNotes = document.getElementById('btnNotes'), btnFull = document.getElementById('btnFull');
  function show(i) {
    cur = Math.max(0, Math.min(slides.length - 1, i));
    slides.forEach(function (s, n) { s.hidden = n !== cur; });
    var cover = slides[cur].dataset.cover === '1';
    elLbl.textContent = cover ? 'COVER' : ('SLIDE ' + cur + '/' + (slides.length - 1));
    elProg.style.width = (cur / (slides.length - 1) * 100) + '%';
    var n = NOTES[cur] || {};
    document.getElementById('nmeta').textContent = n.m || '';
    document.getElementById('nsay').innerHTML = n.say || '';
  }
  document.getElementById('stage').addEventListener('click', function () { show(cur + 1); });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'ArrowRight' || e.key === 'PageDown' || e.key === ' ') { e.preventDefault(); show(cur + 1); }
    else if (e.key === 'ArrowLeft' || e.key === 'PageUp') { e.preventDefault(); show(cur - 1); }
    else if (e.key === 'Home') show(0); else if (e.key === 'End') show(slides.length - 1);
    else if (e.key === 'n' || e.key === 'N') btnNotes.click(); else if (e.key === 'f' || e.key === 'F') btnFull.click();
  });
  btnNotes.addEventListener('click', function () {
    var on = notes.hidden; notes.hidden = !on; btnNotes.setAttribute('aria-pressed', on ? 'true' : 'false');
  });
  btnFull.addEventListener('click', function () {
    if (document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen();
  });
  show(0);
})();
</script>
